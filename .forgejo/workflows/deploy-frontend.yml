# Shizuha Origin CI/CD — multi-arch build + deploy shizuha-pulse frontend.
# The frontend is a separate static nginx image from the Django backend.
name: deploy-shizuha-pulse-frontend
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.forgejo/workflows/deploy-frontend.yml'
      - '.forgejo/scripts/deploy-values-path.py'
      - '.forgejo/scripts/test_deploy_values_path.py'
      - '.forgejo/scripts/exact-deployment-pods.py'
      - '.forgejo/scripts/test_exact_deployment_pods.py'
concurrency:
  group: deploy-shizuha-pulse-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # PLS-1018: skip fork-PR push-event runs (no secrets) so they cannot report
    # a failing status that overrides the green pull_request run.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/pull/')
    runs-on: deploy-lane
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m); case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; esac
          case "$KUBECTL_ARCH" in
            amd64) KUBECTL_SHA=7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3 ;;
            arm64) KUBECTL_SHA=420e6110e3ba7ee5a3927b5af868d18df17aae36b720529ffa4e9e945aa95450 ;;
          esac
          # anonymous-fetch: sanctioned — adding Authorization can turn this public package fetch into 401 (ORIG-144)
          curl --retry 3 --retry-all-errors --retry-delay 1 --max-time 60 -fsSL \
            -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          echo "$KUBECTL_SHA  kubectl" | sha256sum -c -
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run frontend build smoke before deploy
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          JOB="ci-test-shizuha-pulse-frontend-${SHORT}"
          kubectl delete job -n build "${JOB}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-test, service: shizuha-pulse-frontend, shizuha.io/ci-gate: PLAT-1219 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/${{ github.repository }}.git /workspace/src
                        cd /workspace/src
                        git fetch --depth=1 origin ${{ github.sha }}
                        git checkout --detach ${{ github.sha }}
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  # PLS-209: the pulse frontend is not standalone npm-installable
                  # (@shizuha/ui is a file:/packages monorepo dep); Dockerfile.ci is
                  # the adaptation that actually ships. Gate on the SAME build with
                  # --no-push so the smoke can never drift from the deploy.
                  - name: test
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/frontend/Dockerfile.ci
                      - --no-push
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=VITE_BASE_PATH=/pulse/
                      - --build-arg=VITE_API_BASE=/pulse/api
                      - --cache=true
                      - --cache-repo=registry.registry.svc.cluster.local:5000/kaniko-cache/pulse-deploy-frontend-smoke
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                      - --cleanup
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          # Fail fast on job failure: a failed Job never becomes 'complete', so a plain
          # wait hangs to timeout while ttlSecondsAfterFinished deletes the Job and its logs.
          kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=1200s &
          WP=$!
          while kill -0 "$WP" 2>/dev/null; do
            if kubectl get -n build "job/${JOB}" -o jsonpath='{.status.failed}' 2>/dev/null | grep -q '[1-9]'; then
              echo "::error::frontend test/build gate failed"
              kubectl logs -n build "job/${JOB}" --all-containers --tail=200 || true
              kill "$WP" 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done
          wait "$WP" || {
            echo "::error::frontend test/build gate failed (timeout)"
            kubectl logs -n build "job/${JOB}" --all-containers --tail=200 || true
            exit 1
          }
          kubectl logs -n build "job/${JOB}" --all-containers --tail=120 || true
  build-and-deploy:
    # PLS-1018: skip fork-PR push-event runs (no secrets) so they cannot report
    # a failing status that overrides the green pull_request run.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/pull/')
    needs: test
    runs-on: deploy-lane
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m); case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; esac
          case "$KUBECTL_ARCH" in
            amd64) KUBECTL_SHA=7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3 ;;
            arm64) KUBECTL_SHA=420e6110e3ba7ee5a3927b5af868d18df17aae36b720529ffa4e9e945aa95450 ;;
          esac
          # anonymous-fetch: sanctioned — adding Authorization can turn this public package fetch into 401 (ORIG-144)
          curl --retry 3 --retry-all-errors --retry-delay 1 --max-time 60 -fsSL \
            -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          echo "$KUBECTL_SHA  kubectl" | sha256sum -c -
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Materialize exact promotion helpers
        run: |
          set -euo pipefail
          # The deploy-lane runner does not execute actions/checkout correctly
          # (it logged "No steps found" and left an empty workspace). Fetch the
          # runner-local helpers and their self-test input from the exact event
          # revision using the workflow's existing masked Forgejo token, then
          # discard the checkout.
          # The deploy service account intentionally cannot read build Secrets.
          SRC_DIR="$(mktemp -d /tmp/pulse-promotion-src.XXXXXX)"
          trap 'rm -rf "${SRC_DIR}"' EXIT
          GIT_TOKEN='${{ secrets.CI_PACKAGE_TOKEN }}'
          AUTH="$(printf 'x-token-auth:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
          git -C "${SRC_DIR}" init
          git -C "${SRC_DIR}" remote add origin http://forgejo-http.origin.svc.cluster.local/${{ github.repository }}.git
          git -C "${SRC_DIR}" -c http.extraHeader="Authorization: Basic ${AUTH}" \
            fetch --depth=1 origin '${{ github.sha }}'
          git -C "${SRC_DIR}" checkout --detach FETCH_HEAD
          test "$(git -C "${SRC_DIR}" rev-parse HEAD)" = '${{ github.sha }}'
          mkdir -p .forgejo/scripts .forgejo/workflows
          install -m 0644 "${SRC_DIR}/.forgejo/scripts/deploy-values-path.py" .forgejo/scripts/deploy-values-path.py
          install -m 0644 "${SRC_DIR}/.forgejo/scripts/test_deploy_values_path.py" .forgejo/scripts/test_deploy_values_path.py
          install -m 0644 "${SRC_DIR}/.forgejo/scripts/exact-deployment-pods.py" .forgejo/scripts/exact-deployment-pods.py
          install -m 0644 "${SRC_DIR}/.forgejo/scripts/test_exact_deployment_pods.py" .forgejo/scripts/test_exact_deployment_pods.py
          install -m 0644 "${SRC_DIR}/.forgejo/scripts/extract_tracking_key.py" .forgejo/scripts/extract_tracking_key.py
          install -m 0644 "${SRC_DIR}/.forgejo/workflows/deploy.yml" .forgejo/workflows/deploy.yml
          install -m 0644 "${SRC_DIR}/.forgejo/workflows/deploy-frontend.yml" .forgejo/workflows/deploy-frontend.yml
          python3 .forgejo/scripts/test_exact_deployment_pods.py
      - name: Multi-arch build + deploy + verify frontend
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          FTAG="pulse-frontend-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          echo "Multi-arch build shizuha-pulse-frontend:${FTAG} (amd64 + arm64)"

          install_helm() {
            if command -v helm >/dev/null 2>&1; then return; fi
            local HARCH HELM_SHA
            HARCH="$(uname -m)"; case "${HARCH}" in x86_64) HARCH=amd64;; aarch64|arm64) HARCH=arm64;; esac
            case "${HARCH}" in
              amd64) HELM_SHA=fc307327959aa38ed8f9f7e66d45492bb022a66c3e5da6063958254b9767d179 ;;
              arm64) HELM_SHA=d3f8f15b3d9ec8c8678fbf3280c3e5902efabe5912e2f9fcf29107efbc8ead69 ;;
              *) echo "Unsupported helm arch: ${HARCH}" >&2; return 1 ;;
            esac
            curl -fsSL -o /tmp/helm.tgz \
              "https://origin.shizuha.com/api/packages/actions/generic/helm/v3.16.4/helm-v3.16.4-linux-${HARCH}.tar.gz"
            echo "${HELM_SHA}  /tmp/helm.tgz" | sha256sum -c -
            tar xzf /tmp/helm.tgz -C /tmp
            install -m 0755 "/tmp/linux-${HARCH}/helm" /usr/local/bin/helm
          }
          install_helm

          render_build_job() {
            local ARCH="$1"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-pulse-frontend-${SHORT}-${ARCH}
            namespace: build
            labels: { app: ci-build, service: pulse-frontend }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/${{ github.repository }}.git /workspace/src
                        cd /workspace/src && (git checkout ${{ github.sha }} 2>/dev/null || echo "sha not in shallow clone; building default HEAD")
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/frontend/Dockerfile.ci
                      - --destination=${REG}/shizuha-pulse-frontend:${FTAG}-${ARCH}
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=VITE_BASE_PATH=/pulse/
                      - --build-arg=VITE_API_BASE=/pulse/api
                      - --cache=true
                      - --cache-repo=${REG}/kaniko-cache/pulse-deploy-frontend-${ARCH}
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                      - --cleanup
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          for ARCH in amd64 arm64; do
            kubectl delete job -n build "ci-build-pulse-frontend-${SHORT}-${ARCH}" --ignore-not-found
          done
          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          job_name_for_arch() {
            local ARCH="$1"
            render_build_job "$ARCH" | awk '$1 == "name:" { print $2; exit }'
          }
          AMD64_JOB="$(job_name_for_arch amd64)"
          ARM64_JOB="$(job_name_for_arch arm64)"
          test -n "$AMD64_JOB" -a -n "$ARM64_JOB"
          cleanup_build_pair() {
            python3 "$BUILD_GUARD" cleanup \
              --namespace build --job "$AMD64_JOB" --job "$ARM64_JOB"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_pair || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_pair
          render_build_job amd64 | kubectl apply -f -
          render_build_job arm64 | kubectl apply -f -
          python3 "$BUILD_GUARD" wait-pair --namespace build \
            --job "amd64=${AMD64_JOB}" --job "arm64=${ARM64_JOB}" \
            --timeout-seconds 1800
          trap - EXIT INT TERM

          wait_job() {
            local ARCH="$1"
            local JOB="ci-build-pulse-frontend-${SHORT}-${ARCH}"
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=1800s &
            local WP=$!
            while kill -0 "$WP" 2>/dev/null; do
              if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.failed}' | grep -q '[1-9]'; then
                echo "::error::kaniko frontend ${ARCH} build failed"
                kubectl logs -n build "job/${JOB}" --all-containers --tail=80 || true
                exit 1
              fi
              sleep 5
            done
            wait "$WP"
          }
          wait_job amd64 &
          AMD64_WAIT_PID=$!
          wait_job arm64 &
          ARM64_WAIT_PID=$!
          WAIT_STATUS=0
          wait "$AMD64_WAIT_PID" || WAIT_STATUS=$?
          wait "$ARM64_WAIT_PID" || WAIT_STATUS=$?
          [ "$WAIT_STATUS" -eq 0 ] || exit "$WAIT_STATUS"

          collect_job_logs() {
            local JOB="$1"
            local TAIL="${2:-120}"
            local SECONDS_MAX="${3:-30}"
            kubectl logs -n build "job/${JOB}" --all-containers --tail="${TAIL}" &
            local LP=$!
            for _ in $(seq 1 "${SECONDS_MAX}"); do
              if ! kill -0 "${LP}" 2>/dev/null; then
                wait "${LP}" || true
                return 0
              fi
              sleep 1
            done
            echo "log collection timed out after ${SECONDS_MAX}s for job/${JOB}; continuing"
            kill "${LP}" 2>/dev/null || true
            wait "${LP}" 2>/dev/null || true
          }

          kubectl delete job -n build "ci-manifest-pulse-frontend-${SHORT}" --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-pulse-frontend-${SHORT}
            namespace: build
            labels: { app: ci-manifest, service: pulse-frontend }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-pulse-frontend:${FTAG}
                      - -m
                      - ${REG}/shizuha-pulse-frontend:${FTAG}-amd64
                      - -m
                      - ${REG}/shizuha-pulse-frontend:${FTAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-pulse-frontend-${SHORT}" --timeout=300s || {
            echo "::error::frontend manifest combine failed"
            collect_job_logs "ci-manifest-pulse-frontend-${SHORT}" 80 30
            exit 1
          }

          verify_manifest() {
            local REPO="$1"
            local IMAGE_TAG="$2"
            local JOB="ci-verify-${REPO}-${SHORT}"
            kubectl delete job -n build "${JOB}" --ignore-not-found
            cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-verify, service: ${REPO} }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: manifest-check
                    image: python:3.12-alpine
                    command: ["python", "-c"]
                    args:
                      - |
                        import json, urllib.request
                        url = "http://${REG}/v2/${REPO}/manifests/${IMAGE_TAG}"
                        accept = ",".join([
                            "application/vnd.oci.image.index.v1+json",
                            "application/vnd.docker.distribution.manifest.list.v2+json",
                        ])
                        req = urllib.request.Request(url, headers={"Accept": accept})
                        with urllib.request.urlopen(req, timeout=30) as resp:
                            manifest = json.load(resp)
                        platforms = {
                            f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                            for m in manifest.get("manifests", [])
                        }
                        missing = {"linux/amd64", "linux/arm64"} - platforms
                        print(f"{url} platforms={sorted(platforms)}")
                        if missing:
                            raise SystemExit(f"missing required platform(s): {sorted(missing)}")
          YAML
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=120s || {
              echo "::error::manifest verification failed"
              collect_job_logs "${JOB}" 80 30
              exit 1
            }
            collect_job_logs "${JOB}" 20 30
          }
          verify_manifest "shizuha-pulse-frontend" "${FTAG}"
          python3 .forgejo/scripts/test_deploy_values_path.py

          deploy_values_api() {
            # PLAT-4689: DNS + Host header (raw ClusterIP → HTML 403 on private Contents API)
            FGJO_URL="http://forgejo-http.origin.svc.cluster.local"
            FGJO_HOST_HEADER="origin.shizuha.com"
            VALS_PATH="k3s%2Fcharts%2Fshizuha-pulse%2Fvalues.yaml"
          }

          # PLAT-4689: never use curl -sf + stdout discard on deploy Contents API.
          forgejo_contents_curl() {
            local accepted_codes='^(200|201)$'
            if [ "${1:-}" = "--accept-codes" ]; then
              accepted_codes="$2"
              shift 2
            fi
            local method="$1"; shift
            local url="$1"; shift
            local code body_file
            body_file="$(mktemp /tmp/fgjo-http-body.XXXXXX)"
            code="$(
              curl -sS -o "${body_file}" -w '%{http_code}' \
                -X "${method}" \
                -H "Host: ${FGJO_HOST_HEADER:-origin.shizuha.com}" \
                -H "Authorization: token ${{ secrets.DEPLOY_PUSH_TOKEN }}" \
                -H "Content-Type: application/json" \
                "$@" \
                "${url}" || true
            )"
            FGJO_HTTP_CODE="${code}"
            FGJO_HTTP_BODY_FILE="${body_file}"
            if ! printf '%s' "${code}" | grep -Eq "${accepted_codes}"; then
              echo "::error::deploy contents ${method} HTTP ${code} url=${url}" >&2
              python3 - "${body_file}" <<'PYRED' || true
          import json, re, sys
          path = sys.argv[1]
          raw = open(path, 'rb').read()[:4000]
          text = raw.decode('utf-8', 'replace')
          text = re.sub(r'(?i)(token\s+)[0-9a-f]{20,}', r'\1[REDACTED]', text)
          try:
              obj = json.loads(text)
              print('body:', json.dumps(obj)[:1500])
          except Exception:
              print('body_raw:', text[:1500])
          PYRED
              rm -f "${body_file}"
              return 22
            fi
            return 0
          }

          read_deploy_values_to() {
            local dest="$1"
            deploy_values_api
            forgejo_contents_curl GET \
              "${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/contents/${VALS_PATH}" \
              || return $?
            cp "${FGJO_HTTP_BODY_FILE}" "${dest}"
            rm -f "${FGJO_HTTP_BODY_FILE}"
            FGJO_HTTP_BODY_FILE=""
          }

          update_deploy_values_frontend_tag() {
            local IMAGE_TAG="$1"
            local FILE_SHA CURRENT_FRONTEND_TAG NEW_B64 BODY
            deploy_values_api
            for write_attempt in 1 2 3 4 5; do
              read_deploy_values_to /tmp/pulse-frontend-deploy-values-resp.json
              FILE_SHA="$(python3 -c 'import json; print(json.load(open("/tmp/pulse-frontend-deploy-values-resp.json"))["sha"])')"
              python3 -c 'import base64,json; open("/tmp/values.yaml","wb").write(base64.b64decode(json.load(open("/tmp/pulse-frontend-deploy-values-resp.json"))["content"]))'
              CURRENT_FRONTEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/values.yaml frontend.image.tag)"
              if [ "${CURRENT_FRONTEND_TAG}" = "${IMAGE_TAG}" ]; then
                echo "deploy repo already desires ${IMAGE_TAG}"
                return 0
              fi
              python3 .forgejo/scripts/deploy-values-path.py set /tmp/values.yaml frontend.image.tag "${IMAGE_TAG}" >/dev/null
              NEW_B64="$(base64 -w0 /tmp/values.yaml)"
              # PLAT-10373: fleet deploy admission (PLAT-4862, fail closed) requires a
              # Pulse key in the deploy commit message. Propagate the key from the
              # pinned source commit (tag suffix = source SHA); fall back to the
              # admission-conflict carrier so a pin never lands untracked.
              PIN_SOURCE_SHA="${IMAGE_TAG##*-}"
              forgejo_contents_curl --accept-codes '^(200)$' GET \
                "${FGJO_URL}/api/v1/repos/shizuha-labs/pulse/git/commits/${PIN_SOURCE_SHA}" || true
              # PLAT-10373 (rei review 5633): three-way contract — exit 0 = verified key
              # (case-insensitive match, normalized uppercase, first-match primary);
              # exit 3 = lookup/parse/provenance failure -> FAIL CLOSED (no untracked pin,
              # no silent carrier substitution); exit 4 = verifiably keyless message ->
              # carrier fallback is legitimate. Lowercase refs (pls-1349) normalize; slug
              # fragments (pls1349-merge-correlation-pin) never match.
              set +e
              python3 .forgejo/scripts/extract_tracking_key.py --expect-sha "${PIN_SOURCE_SHA}" --file "${FGJO_HTTP_BODY_FILE}" > /tmp/pin-key.txt 2> /tmp/pin-key.err
              PIN_EXTRACT_RC=$?
              set -e
              if [ "$PIN_EXTRACT_RC" -eq 0 ]; then
                PIN_TRACKING_KEY="$(cat /tmp/pin-key.txt)"
              elif [ "$PIN_EXTRACT_RC" -eq 4 ]; then
                PIN_TRACKING_KEY="PLAT-10373"
                echo "PLAT-10373: pinned source commit carries no tracking key; using carrier fallback"
              else
                cat /tmp/pin-key.err >&2 || true
                echo "::error::PLAT-10373 provenance failure: tracking key could not be verified for source ${PIN_SOURCE_SHA}; failing closed (no untracked pin)"
                rm -f "${FGJO_HTTP_BODY_FILE}" /tmp/pin-key.txt /tmp/pin-key.err; FGJO_HTTP_BODY_FILE=""
                exit 1
              fi
              rm -f "${FGJO_HTTP_BODY_FILE}" /tmp/pin-key.txt /tmp/pin-key.err; FGJO_HTTP_BODY_FILE=""
              BODY="$(python3 -c "import json,sys; print(json.dumps({'message':'ci(shizuha-pulse): desired frontend tag ${IMAGE_TAG} before rollout (tracks ${PIN_TRACKING_KEY})','content':sys.argv[1],'sha':'${FILE_SHA}','branch':'master','committer':{'email':'ci@shizuha.com','name':'Origin CI'}}))" "${NEW_B64}")"
              forgejo_contents_curl --accept-codes '^(200|201|409)$' PUT \
                "${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/contents/${VALS_PATH}" \
                -d "${BODY}"
              rm -f "${FGJO_HTTP_BODY_FILE}"
              FGJO_HTTP_BODY_FILE=""
              if printf '%s' "${FGJO_HTTP_CODE}" | grep -Eq '^(200|201)$'; then
                PROMOTED=true
                echo "deploy repo desired frontend tag updated to ${IMAGE_TAG}"
                return 0
              fi
              if [ "${write_attempt}" != 5 ]; then
                echo "deploy values changed concurrently; retrying fresh read (${write_attempt}/5)"
                sleep 2
                continue
              fi
              echo "::error::deploy values changed concurrently on all five write attempts"
              return 1
            done
          }

          assert_deploy_values_frontend_tag() {
            local EXPECTED="$1"
            local ACTUAL
            read_deploy_values_to /tmp/pulse-frontend-deploy-values-resp.json
            python3 -c 'import base64,json; open("/tmp/values.yaml","wb").write(base64.b64decode(json.load(open("/tmp/pulse-frontend-deploy-values-resp.json"))["content"]))'
            ACTUAL="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/values.yaml frontend.image.tag)"
            echo "deploy repo desired frontend tag: ${ACTUAL}"
            test "${ACTUAL}" = "${EXPECTED}" || { echo "::error::deploy repo desired frontend tag ${ACTUAL} != ${EXPECTED}"; exit 1; }
          }

          dispatch_lifecycle_reconcile() {
            deploy_values_api
            forgejo_contents_curl --accept-codes '^204$' POST \
              "${FGJO_URL}/api/v1/repos/shizuha-labs/deploy/actions/workflows/deploy-id-mail-lifecycle.yml/dispatches" \
              -d '{"ref":"master"}'
            rm -f "${FGJO_HTTP_BODY_FILE}"
            FGJO_HTTP_BODY_FILE=""
          }

          # The canonical chart is the sole desired-state authority, and the
          # central lifecycle is the sole Helm/workload writer.
          PROMOTED=false
          update_deploy_values_frontend_tag "${FTAG}"
          assert_deploy_values_frontend_tag "${FTAG}"
          if [ "${PROMOTED}" != true ]; then
            dispatch_lifecycle_reconcile
            echo "central lifecycle reconcile dispatched for existing desired tag ${FTAG}"
          fi

          deployment_state() {
            kubectl get deploy -n shizuha "$1" -o json 2>/dev/null | python3 -c '
          import json, sys
          obj = json.load(sys.stdin)
          meta, spec, status = obj.get("metadata", {}), obj.get("spec", {}), obj.get("status", {})
          fields = (
              meta.get("generation", ""), status.get("observedGeneration", ""),
              status.get("updatedReplicas", ""), status.get("availableReplicas", ""),
              status.get("readyReplicas", ""), spec.get("replicas", ""),
          )
          print("|".join(str(value) for value in fields))
          '
          }

          exact_pod_state() {
            local selector="$1"
            local expected_image="$2"
            kubectl get pods -n shizuha -l "${selector}" -o json 2>/dev/null \
              | python3 .forgejo/scripts/exact-deployment-pods.py \
                  --expected-image "${expected_image}"
          }

          EXPECTED_FRONTEND_IMAGE="localhost:30500/shizuha-pulse-frontend:${FTAG}"
          # PLAT-8596: the 2026-09-11 run 6091 burned 69 silent minutes and
          # failed with "did not converge" and ZERO state evidence — the
          # non-converging component (image tag vs pod readiness vs old/
          # foreign/restarting pods) was unattributable from logs alone.
          # Emit a throttled one-line state each attempt and a full dump on
          # the final failure, per the workflow's own forensics doctrine
          # ("a refusal must name its branch and numbers").
          convergence_state_line() {
            printf 'conv attempt=%s fe[img=%s gen/obs=%s/%s upd/avl/rdy/des=%s/%s/%s/%s pods=%s rdy=%s old=%s foreign=%s restarts=%s] be[img=%s gen/obs=%s/%s upd/avl/rdy/des=%s/%s/%s/%s pods=%s rdy=%s old=%s foreign=%s restarts=%s] helm[fe=%s be=%s] chart[fe=%s be=%s]' \
              "$1" "${LIVE##*/}" "${GENERATION:-?}" "${OBSERVED:-?}" \
              "${UPDATED:-?}" "${AVAILABLE:-?}" "${READY:-?}" "${DESIRED:-?}" \
              "${EXACT_PODS:-?}" "${EXACT_READY_PODS:-?}" "${OLD_PODS:-?}" "${FOREIGN_PODS:-?}" "${EXACT_RESTARTS:-?}" \
              "${LIVE_BACKEND##*/}" "${BACKEND_GENERATION:-?}" "${BACKEND_OBSERVED:-?}" \
              "${BACKEND_UPDATED:-?}" "${BACKEND_AVAILABLE:-?}" "${BACKEND_READY:-?}" "${BACKEND_DESIRED:-?}" \
              "${BACKEND_EXACT_PODS:-?}" "${BACKEND_EXACT_READY_PODS:-?}" "${BACKEND_OLD_PODS:-?}" "${BACKEND_FOREIGN_PODS:-?}" "${BACKEND_EXACT_RESTARTS:-?}" \
              "${STORED_FRONTEND_TAG:-?}" "${STORED_BACKEND_TAG:-?}" \
              "${CHART_FRONTEND_TAG:-?}" "${CHART_BACKEND_TAG:-?}"
          }
          convergence_dump() {
            echo "--- convergence failure diagnostics (PLAT-8596) ---"
            convergence_state_line "final"
            echo
            for d in shizuha-pulse-frontend shizuha-pulse; do
              echo "--- deploy/${d}:"
              kubectl get deploy -n shizuha "${d}" -o wide 2>&1 || true
            done
            echo "--- frontend pods:"
            kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-pulse-frontend -o wide 2>&1 || true
            echo "--- backend pods:"
            kubectl get pods -n shizuha -l 'app.kubernetes.io/component=backend,app.kubernetes.io/instance=shizuha-pulse,app.kubernetes.io/name=shizuha-pulse' -o wide 2>&1 || true
            echo "--- non-Ready pod conditions/reasons:"
            kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-pulse-frontend -o json 2>/dev/null | python3 /tmp/pulse_notready.py || true
            kubectl get pods -n shizuha -l 'app.kubernetes.io/component=backend,app.kubernetes.io/instance=shizuha-pulse,app.kubernetes.io/name=shizuha-pulse' -o json 2>/dev/null | python3 /tmp/pulse_notready.py || true
            echo "--- recent events (shizuha ns, pulse pods):"
            kubectl get events -n shizuha --sort-by=.lastTimestamp 2>/dev/null | grep -E 'pulse' | tail -20 || true
            echo "--- end convergence failure diagnostics ---"
          }
          cat > /tmp/pulse_notready.py <<'PY'
          import json
          import sys

          for p in json.load(sys.stdin).get("items", []):
              not_ready = [
                  c for c in p.get("status", {}).get("conditions", [])
                  if c.get("type") == "Ready" and c.get("status") != "True"
              ]
              waiting = []
              for s in p.get("status", {}).get("containerStatuses", []) or []:
                  reason = (s.get("state", {}) or {}).get("waiting", {}) or {}
                  if reason.get("reason"):
                      waiting.append(reason["reason"])
              if not_ready or waiting:
                  print(
                      p.get("metadata", {}).get("name"), "|",
                      p.get("status", {}).get("phase"), "|",
                      not_ready, "|", waiting,
                  )
          PY
          for attempt in $(seq 1 540); do
            read_deploy_values_to /tmp/pulse-convergence-values.json
            python3 -c 'import base64,json; open("/tmp/convergence-values.yaml","wb").write(base64.b64decode(json.load(open("/tmp/pulse-convergence-values.json"))["content"]))'
            CHART_BACKEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/convergence-values.yaml image.tag)"
            CHART_FRONTEND_TAG="$(python3 .forgejo/scripts/deploy-values-path.py get /tmp/convergence-values.yaml frontend.image.tag)"
            # The same commit-serialized desired-state writer can advance the
            # frontend tag while this run waits for lifecycle convergence.
            # Stop the superseded waiter immediately instead of burning the
            # deploy lane until its 45-minute timeout.
            if [ -n "${CHART_FRONTEND_TAG}" ] && [ "${CHART_FRONTEND_TAG}" != "${FTAG}" ]; then
              echo "Pulse frontend desired state advanced to ${CHART_FRONTEND_TAG}; this run is superseded"
              exit 0
            fi
            EXPECTED_BACKEND_IMAGE="localhost:30500/shizuha-pulse:${CHART_BACKEND_TAG}"
            LIVE="$(kubectl get deploy -n shizuha shizuha-pulse-frontend -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            LIVE_BACKEND="$(kubectl get deploy -n shizuha shizuha-pulse -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
            FRONTEND_STATE="$(deployment_state shizuha-pulse-frontend || true)"
            IFS='|' read -r GENERATION OBSERVED UPDATED AVAILABLE READY DESIRED <<< "${FRONTEND_STATE}"
            FRONTEND_POD_STATE="$(
              exact_pod_state \
                'app.kubernetes.io/name=shizuha-pulse-frontend' \
                "${EXPECTED_FRONTEND_IMAGE}" || true
            )"
            IFS='|' read -r EXACT_PODS EXACT_READY_PODS OLD_PODS FOREIGN_PODS EXACT_RESTARTS \
              <<< "${FRONTEND_POD_STATE}"
            BACKEND_STATE="$(deployment_state shizuha-pulse || true)"
            IFS='|' read -r BACKEND_GENERATION BACKEND_OBSERVED BACKEND_UPDATED BACKEND_AVAILABLE BACKEND_READY BACKEND_DESIRED <<< "${BACKEND_STATE}"
            BACKEND_POD_STATE="$(
              exact_pod_state \
                'app.kubernetes.io/component=backend,app.kubernetes.io/instance=shizuha-pulse,app.kubernetes.io/name=shizuha-pulse' \
                "${EXPECTED_BACKEND_IMAGE}" || true
            )"
            IFS='|' read -r BACKEND_EXACT_PODS BACKEND_EXACT_READY_PODS BACKEND_OLD_PODS BACKEND_FOREIGN_PODS BACKEND_EXACT_RESTARTS \
              <<< "${BACKEND_POD_STATE}"
            HELM_VALUES="$(helm get values shizuha-pulse -n shizuha -o json 2>/dev/null || true)"
            STORED_BACKEND_TAG="$(printf '%s' "${HELM_VALUES}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("image",{}).get("tag",""))' 2>/dev/null || true)"
            STORED_FRONTEND_TAG="$(printf '%s' "${HELM_VALUES}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("frontend",{}).get("image",{}).get("tag",""))' 2>/dev/null || true)"
            if [ "${CHART_FRONTEND_TAG}" = "${FTAG}" ] \
              && [ "${LIVE}" = "${EXPECTED_FRONTEND_IMAGE}" ] \
              && [ "${LIVE_BACKEND}" = "${EXPECTED_BACKEND_IMAGE}" ] \
              && [ "${STORED_FRONTEND_TAG}" = "${CHART_FRONTEND_TAG}" ] \
              && [ "${STORED_BACKEND_TAG}" = "${CHART_BACKEND_TAG}" ] \
              && [ -n "${GENERATION}" ] && [ -n "${OBSERVED}" ] && [ "${OBSERVED}" -ge "${GENERATION}" ] \
              && [ -n "${DESIRED}" ] && [ "${UPDATED}" = "${DESIRED}" ] \
              && [ "${AVAILABLE}" = "${DESIRED}" ] && [ "${READY}" = "${DESIRED}" ] \
              && [ "${EXACT_PODS}" = "${DESIRED}" ] \
              && [ "${EXACT_READY_PODS}" = "${DESIRED}" ] \
              && [ "${OLD_PODS}" = 0 ] && [ "${FOREIGN_PODS}" = 0 ] \
              && [ "${EXACT_RESTARTS}" = 0 ] \
              && [ -n "${BACKEND_GENERATION}" ] && [ -n "${BACKEND_OBSERVED}" ] \
              && [ "${BACKEND_OBSERVED}" -ge "${BACKEND_GENERATION}" ] \
              && [ -n "${BACKEND_DESIRED}" ] && [ "${BACKEND_UPDATED}" = "${BACKEND_DESIRED}" ] \
              && [ "${BACKEND_AVAILABLE}" = "${BACKEND_DESIRED}" ] \
              && [ "${BACKEND_READY}" = "${BACKEND_DESIRED}" ] \
              && [ "${BACKEND_EXACT_PODS}" = "${BACKEND_DESIRED}" ] \
              && [ "${BACKEND_EXACT_READY_PODS}" = "${BACKEND_DESIRED}" ] \
              && [ "${BACKEND_OLD_PODS}" = 0 ] && [ "${BACKEND_FOREIGN_PODS}" = 0 ] \
              && [ "${BACKEND_EXACT_RESTARTS}" = 0 ]; then
              echo "Chart, Helm, frontend, and backend converged on attempt ${attempt}"
              break
            fi
            # PLAT-8596: throttled progress — one line every ~60s (12 × 5s)
            # so a stalled convergence is visible (and attributable) in the
            # run log long before the 45-minute timeout.
            if [ $((attempt % 12)) -eq 1 ]; then
              convergence_state_line "${attempt}"
              echo
            fi
            if [ "${attempt}" = 540 ]; then
              convergence_dump
              echo "::error::central lifecycle did not converge Pulse frontend"; exit 1
            fi
            sleep 5
          done

          cat > /tmp/pulse_frontend_ready_pods.py <<'PY'
          import json
          import sys

          tag = sys.argv[1]
          data = json.load(sys.stdin)
          rows = []
          for pod in data.get("items", []):
              name = pod.get("metadata", {}).get("name", "")
              image = (pod.get("spec", {}).get("containers") or [{}])[0].get("image", "")
              status = pod.get("status", {})
              ready = any(
                  c.get("type") == "Ready" and c.get("status") == "True"
                  for c in status.get("conditions", [])
              )
              ip = status.get("podIP")
              if tag in image and status.get("phase") == "Running" and ready and ip:
                  rows.append((name, ip))
          for name, ip in sorted(rows):
              print(f"{name} {ip}")
          PY

          cat > /tmp/pulse_frontend_endpoint_convergence.py <<'PY'
          import json
          import sys

          tag, expected_replicas, pods_path, slices_path = sys.argv[1:]
          expected_replicas = int(expected_replicas)

          with open(pods_path) as stream:
              pods = json.load(stream)
          with open(slices_path) as stream:
              slices = json.load(stream)

          current_addresses = set()
          for pod in pods.get("items", []):
              image = (pod.get("spec", {}).get("containers") or [{}])[0].get("image", "")
              status = pod.get("status", {})
              ready = any(
                  condition.get("type") == "Ready" and condition.get("status") == "True"
                  for condition in status.get("conditions", [])
              )
              address = status.get("podIP")
              if image.endswith(f":{tag}") and status.get("phase") == "Running" and ready and address:
                  current_addresses.add(address)

          service_addresses = set()
          for endpoint_slice in slices.get("items", []):
              for endpoint in endpoint_slice.get("endpoints", []):
                  if endpoint.get("conditions", {}).get("ready") is False:
                      continue
                  for address in endpoint.get("addresses", []):
                      service_addresses.add(address)

          print(f"current ready {tag} endpoints ({len(current_addresses)}/{expected_replicas}):")
          for address in sorted(current_addresses):
              print(f"  {address}")
          print("service endpoints:")
          for address in sorted(service_addresses):
              print(f"  {address}")

          if len(current_addresses) != expected_replicas:
              raise SystemExit(1)
          if service_addresses != current_addresses:
              raise SystemExit(1)
          PY

          NEW_POD_ROWS=""
          for attempt in $(seq 1 60); do
            EXPECTED_REPLICAS="$(kubectl get deploy -n shizuha shizuha-pulse-frontend -o jsonpath='{.spec.replicas}')"
            NEW_POD_ROWS="$(kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-pulse-frontend -o json | python3 /tmp/pulse_frontend_ready_pods.py "${FTAG}")"
            READY_NEW_COUNT="$(printf '%s\n' "${NEW_POD_ROWS}" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "${READY_NEW_COUNT}" = "${EXPECTED_REPLICAS}" ]; then
              break
            fi
            echo "waiting for ${EXPECTED_REPLICAS} ready frontend pods on ${FTAG}; got ${READY_NEW_COUNT}"
            sleep 5
          done
          READY_NEW_COUNT="$(printf '%s\n' "${NEW_POD_ROWS}" | sed '/^$/d' | wc -l | tr -d ' ')"
          test "${READY_NEW_COUNT}" = "${EXPECTED_REPLICAS}" || {
            echo "::error::new frontend pods did not become ready"
            kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-pulse-frontend -o wide
            exit 1
          }
          echo "new frontend pods:"
          printf '%s\n' "${NEW_POD_ROWS}"

          render_smoke_job() {
            local JOB="$1"
            local TARGETS="$2"
            local SAMPLES="$3"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-smoke, service: pulse-frontend }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.8.0
                    env:
                      - name: SMOKE_TARGETS
                        value: "${TARGETS}"
                      - name: SMOKE_SAMPLES
                        value: "${SAMPLES}"
                    command: ["/bin/sh", "-ec"]
                    args:
                      - |
                        smoke_target() {
                          target="\${1%/}/"
                          origin="\${target%/pulse/}"
                          for i in \$(seq 1 "\${SMOKE_SAMPLES:-20}"); do
                            html="\$(curl -fsS --max-time 10 "\${target}")"
                            ref="\$(printf '%s' "\$html" | grep -oE '/(([a-z]+)/)?assets/[A-Za-z0-9._-]+\\.js' | head -1)"
                            test -n "\$ref" || { echo "no asset ref in \$target"; return 1; }
                            case "\$ref" in /pulse/assets/*) ;; *) echo "wrong asset base from \$target: \$ref"; return 1 ;; esac
                            code="\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "\${origin}\${ref}")"
                            test "\$code" = "200" || { echo "asset \${origin}\${ref} returned \$code"; return 1; }
                          done
                        }

                        smoke_once() {
                          for target in \${SMOKE_TARGETS}; do
                            echo "smoking \$target"
                            smoke_target "\$target"
                          done
                        }

                        # Require a clean window, but retry the whole window so
                        # transient network or endpoint convergence does not leave
                        # the live cluster ahead of deploy values.
                        for attempt in \$(seq 1 30); do
                          if output="\$(smoke_once 2>&1)"; then
                            printf '%s\n' "\$output"
                            echo "pulse frontend base-path smoke passed"
                            exit 0
                          fi
                          echo "smoke attempt \$attempt failed: \$output"
                          sleep 5
                        done
                        echo "pulse frontend base-path smoke failed after retries"
                        exit 1
          YAML
          }

          run_smoke_job() {
            local JOB="$1"
            local TARGETS="$2"
            local SAMPLES="$3"
            kubectl delete job -n build "${JOB}" --ignore-not-found
            render_smoke_job "${JOB}" "${TARGETS}" "${SAMPLES}" | kubectl apply -f -
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=360s || {
              echo "::error::frontend smoke failed: ${JOB}"
              collect_job_logs "${JOB}" 120 30
              exit 1
            }
            echo "frontend smoke job completed: ${JOB}"
          }

          POD_TARGETS="$(printf '%s\n' "${NEW_POD_ROWS}" | awk '{printf "%shttp://%s/pulse/", sep, $2; sep=" "}')"
          run_smoke_job "ci-smoke-pulse-frontend-pods-${SHORT}" "${POD_TARGETS}" 3

          # PLS-457-CONVERGENCE-FUNCTION-BEGIN
          wait_for_frontend_endpoint_convergence() {
            local PHASE="$1"
            local MAX_ATTEMPTS="${2:-60}"
            local EXPECTED_REPLICAS
            for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
              # Re-read the complete snapshot every time. Kubernetes may replace
              # an exact-build pod (and its IP), while HPA may change the desired
              # replica count. Freezing any side turns normal churn into a false
              # deploy failure (PLS-457).
              EXPECTED_REPLICAS="$(kubectl get deploy -n shizuha shizuha-pulse-frontend -o jsonpath='{.spec.replicas}')"
              kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-pulse-frontend -o json > /tmp/pulse_frontend_current_pods.json
              kubectl get endpointslice -n shizuha -l kubernetes.io/service-name=shizuha-pulse-frontend -o json > /tmp/pulse_frontend_current_slices.json
              if python3 /tmp/pulse_frontend_endpoint_convergence.py \
                "${FTAG}" "${EXPECTED_REPLICAS}" \
                /tmp/pulse_frontend_current_pods.json /tmp/pulse_frontend_current_slices.json; then
                echo "${PHASE} converged to current ready ${FTAG} pods"
                return 0
              fi
              echo "waiting for ${PHASE} convergence (attempt ${attempt}/${MAX_ATTEMPTS})"
              sleep 5
            done
            echo "::error::${PHASE} did not converge to current ready frontend build"
            kubectl get endpointslice -n shizuha -l kubernetes.io/service-name=shizuha-pulse-frontend -o yaml
            return 1
          }
          # PLS-457-CONVERGENCE-FUNCTION-END

          echo "waiting for shizuha-pulse-frontend EndpointSlices to point only at current ready ${FTAG} pods"
          wait_for_frontend_endpoint_convergence "service endpoints" 60

          echo "starting service-level frontend smoke job"
          run_smoke_job "ci-smoke-pulse-frontend-${SHORT}" "http://shizuha-pulse-frontend.shizuha.svc.cluster.local/pulse/" 20

          # Re-read and retry the final desired-state snapshot. HPA/replacement
          # churn may begin after the first convergence and during service smoke;
          # a one-shot final check would reintroduce the same false-failure race.
          wait_for_frontend_endpoint_convergence "final desired-state verification" 60

          # End-state invariant: the rollout may not finish with live state
          # ahead of deploy repo desired state.
          assert_deploy_values_frontend_tag "${FTAG}"
          LIVE="$(kubectl get deploy -n shizuha shizuha-pulse-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "${LIVE}" | grep -q "${FTAG}" || { echo "::error::frontend image mismatch after smoke"; exit 1; }
          echo "Verified canonical chart, Helm values, and live frontend image for ${FTAG}: ${LIVE}"
