name: security-ci-cascade
on:
  push:
    branches: [main]
    paths:
      - .forgejo/workflows/security-ci.yml
      - security-ci/consumers.json
      - security-ci/templates/security-ci-parity.yml
      - scripts/check-security-ci-contract.py
      - scripts/security-ci-cascade.py
      - scripts/security-ci-to-pulse.py
      - scripts/security-ci-vendor.py
  workflow_dispatch: {}

# Event-driven only: a reviewed canonical merge opens/updates normal consumer
# PRs. There is deliberately no schedule/polling sweep (PLAT-5093).
# Fail-loud owner: Origin's ci-failure-notifier observes every failed workflow
# completion in this repository and DMs the Engineering lead through Connect
# (PLAT-1254).  PLAT-4120 records same-repo live delivery at failure time.
concurrency:
  group: security-ci-cascade
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Validate canonical inventory and generated bytes
        run: |
          python3 scripts/security-ci-vendor.py verify
      - name: Open or update consumer PRs
        env:
          # Existing org automation credential used by deploy workflows for
          # Forgejo Contents API writes. The cascade script restricts it to
          # versioned feature branches and normal PRs; it never targets primary.
          SECURITY_CI_CASCADE_TOKEN: ${{ secrets.DEPLOY_PUSH_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          python3 scripts/security-ci-cascade.py --apply
