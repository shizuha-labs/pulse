name: security-ci-parity
on:
  pull_request:
    paths:
      - .forgejo/workflows/security-ci.yml
      - .forgejo/workflows/security-ci-cascade.yml
      - .forgejo/workflows/security-ci-parity.yml
      - security-ci/**
      - scripts/check-security-ci-contract.py
      - scripts/security-ci-cascade.py
      - scripts/security-ci-to-pulse.py
      - scripts/security-ci-vendor.py
      - tasks/test_plat5093_security_ci_fleet.py
  workflow_dispatch: {}

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Validate canonical contract, inventory, and generated bytes
        run: |
          python3 scripts/check-security-ci-contract.py
          python3 scripts/security-ci-vendor.py verify
          python3 -m unittest tasks.test_plat4943_security_ci_timeout tasks.test_plat5093_security_ci_fleet
