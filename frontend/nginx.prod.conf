server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Health check endpoint (must be before base path location)
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Base path for this service - strip prefix and serve from html root
    location /pulse/ {
        alias /usr/share/nginx/html/;
        index index.html;

        # JS/CSS must revalidate so browsers do not keep stale UI after CI deploys.
        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # Fingerprinted media/font assets can remain long-lived.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA routing - serve index.html for all routes
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /pulse/index.html;
    }

    # Redirect root to base path
    location = / {
        return 301 /pulse/;
    }
}
