[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:django]
command=/bin/sh -c 'exec gunicorn taskmanager.wsgi:application --bind 0.0.0.0:8002 --workers "${PULSE_GUNICORN_WORKERS:-5}" --worker-class "${PULSE_GUNICORN_WORKER_CLASS:-sync}" --threads "${PULSE_GUNICORN_THREADS:-1}" --timeout "${PULSE_GUNICORN_TIMEOUT:-120}" --access-logfile - --access-logformat "%%({x-forwarded-for}i)s %%(l)s %%(u)s %%(t)s \"%%(r)s\" %%(s)s %%(b)s \"%%(f)s\" \"%%(a)s\" duration_us=%%(D)s pid=%%(p)s"'
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="taskmanager.settings",PULSE_ACTIVE_AGENT_EMAILS=""
priority=3
# PLAT-4124/PLAT-5343: Kubernetes removes a terminating pod from normal
# Service traffic before signaling the container. Give Gunicorn enough time
# to finish requests that were already in flight instead of letting
# supervisord's 10-second default turn a routine rollout/scale-down into a 500.
stopwaitsecs=30

; PLAT-4601: isolated ClusterIP-only listener.  One threaded worker makes the
; in-process rate/concurrency bounds authoritative for the listener.
[program:probe-listener]
command=gunicorn taskmanager.probe_wsgi:application --bind 0.0.0.0:18002 --workers 1 --worker-class gthread --threads 8 --timeout 10 --access-logfile -
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="taskmanager.probe_settings",PULSE_ACTIVE_AGENT_EMAILS=""
priority=3

[program:celery-worker]
command=celery -A taskmanager worker --loglevel=info --concurrency=1 -Q shizuha_pulse

; PLS-1421: freshness-critical cadence tasks (sweep_org_health — 10-min beat
; cadence must beat the 45m snapshot-freshness alert threshold) get a
; dedicated 1-slot queue so multi-hour assign-sweep chains on the shared
; shizuha_pulse queue can never starve them. The beat-side routing lives in
; CELERY_TASK_ROUTES (taskmanager/settings.py) — task_routes is what the
; name-based send_task router reads (aoi review 6473).
[program:celery-worker-freshness]
command=celery -A taskmanager worker --loglevel=info --concurrency=1 -Q freshness
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="taskmanager.settings",PULSE_ACTIVE_AGENT_EMAILS=""
priority=4

; PLS-207: beat + scheduler are cluster singletons — leader_exec holds a Redis
; lease so exactly one instance runs across all replicas (standbys take over
; automatically when the leader pod dies/rolls).
[program:celery-beat]
command=python manage.py leader_exec --name beat -- celery -A taskmanager beat --loglevel=info --scheduler=django_celery_beat.schedulers:DatabaseScheduler
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="taskmanager.settings",PULSE_ACTIVE_AGENT_EMAILS=""
priority=5

[program:scheduler]
command=python manage.py leader_exec --name scheduler -- python manage.py run_scheduler
directory=/app
user=root
autostart=true
autorestart=true
startretries=999
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="taskmanager.settings",PULSE_ACTIVE_AGENT_EMAILS=""
priority=6

[program:mcp-server]
command=python /app/mcp-server/pulse_server.py --http-port 18101
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_PULSE_URL="http://localhost:8002",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=10
# Streamable-HTTP responses need the same bounded drain window. The old
# 10-second supervisor default was observed SIGKILLing this process during
# scale-down, producing incomplete ASGI responses and lost MCP calls.
stopwaitsecs=30

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
